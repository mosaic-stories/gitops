global:
  imageTag: prod-f5ae546
  environment: prod
web:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
coreApi:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
  podDisruptionBudget:
    minAvailable: 1
  # Full environment configuration for production
  # NOTE: Helm does not deep-merge arrays, so we must include the complete env array here
  env:
    - name: PORT
      value: "8080"
    - name: ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
    - name: AWS_REGION
      value: "us-east-1"
    # Google OAuth Configuration
    - name: GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: google-oauth
          key: client-id
    - name: GOOGLE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: google-oauth
          key: client-secret
    # Application URLs
    - name: APP_URL
      value: "https://mosaiclife.me"
    - name: API_URL
      value: "https://api.mosaiclife.me"
    # SES Email Configuration
    - name: SES_FROM_EMAIL
      value: "noreply@mosaiclife.me"
    - name: SES_REGION
      value: "us-east-1"
    # Session Configuration
    - name: SESSION_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: session-secret
          key: secret-key
    - name: SESSION_COOKIE_DOMAIN
      value: ".mosaiclife.me"
    # Internal API token - gates the CronJob-facing cleanup endpoints
    - name: INTERNAL_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: internal-api-token
          key: token
    # AWS S3 Configuration
    - name: STORAGE_BACKEND
      value: "s3"
    - name: S3_MEDIA_BUCKET
      value: "mosaic-prod-media-033691785857"
    - name: S3_BACKUP_BUCKET
      value: "mosaic-prod-backups-033691785857"
    # Database URL from External Secrets
    - name: DB_URL
      valueFrom:
        secretKeyRef:
          name: database-credentials
          key: DB_URL
    - name: BEDROCK_GUARDRAIL_ID
      value: o1m8awhi99vh
    - name: BEDROCK_GUARDRAIL_VERSION
      value: 1
    # Neptune Graph Database Configuration
    - name: NEPTUNE_HOST
      valueFrom:
        secretKeyRef:
          name: neptune-connection
          key: host
    - name: NEPTUNE_PORT
      valueFrom:
        secretKeyRef:
          name: neptune-connection
          key: port
    - name: NEPTUNE_REGION
      valueFrom:
        secretKeyRef:
          name: neptune-connection
          key: region
    - name: NEPTUNE_IAM_AUTH
      valueFrom:
        secretKeyRef:
          name: neptune-connection
          key: iam_auth
    - name: NEPTUNE_ENV_PREFIX
      valueFrom:
        secretKeyRef:
          name: neptune-connection
          key: env_prefix
    # LiteLLM AI Proxy
    - name: LITELLM_BASE_URL
      value: "http://litellm.aiservices.svc.cluster.local:4000"
    - name: AI_LLM_PROVIDER
      value: "litellm"
    - name: AI_EMBEDDING_PROVIDER
      value: "litellm"
externalSecrets:
  session:
    secretKey: "mosaic/prod/session/secret-key"
  neptune:
    secretKey: "mosaic/prod/neptune/connection"
  litellm:
    secretKey: "mosaic/prod/litellm/api-key"
